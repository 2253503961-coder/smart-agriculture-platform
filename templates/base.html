<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智慧农业监控系统{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E7D32',      // 主色调：绿色（代表农业、自然）
                        secondary: '#FFC107',    // 辅助色：黄色（代表阳光）
                        accent: '#1976D2',       // 强调色：蓝色（代表水）
                        neutral: '#F5F5F5',      // 中性色：浅灰
                        dark: '#263238',         // 深色：深灰
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .sidebar-shadow {
                box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            }
            .transition-all-300 {
                transition: all 300ms ease-in-out;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="bg-white sidebar-shadow w-64 flex-shrink-0 hidden md:block transition-all-300">
            <div class="p-5 border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <i class="fa fa-leaf text-2xl text-primary"></i>
                    <h1 class="text-xl font-bold text-primary">智慧农业监控系统</h1>
                </div>
            </div>
            
            <nav class="p-4">
                <ul class="space-y-1">
                    <li>
                        <a href="/" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-primary/10 text-primary font-medium">
                            <i class="fa fa-dashboard"></i>
                            <span>总览</span>
                        </a>
                    </li>
                    <li>
                        <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700 transition-all-300">
                            <i class="fa fa-area-chart"></i>
                            <span>数据监控</span>
                        </a>
                    </li>
                    <li>
                        <a href="/devices" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700 transition-all-300">
                            <i class="fa fa-cogs"></i>
                            <span>设备控制</span>
                        </a>
                    </li>
                    <li>
                        <a href="/analytics" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700 transition-all-300">
                            <i class="fa fa-bar-chart"></i>
                            <span>数据分析</span>
                        </a>
                    </li>
                </ul>
                
                <div class="mt-8 pt-6 border-t border-gray-100">
                    <h3 class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        系统
                    </h3>
                    <ul class="mt-3 space-y-1">
                        <li>
                            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700 transition-all-300">
                                <i class="fa fa-cog"></i>
                                <span>设置</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100 text-gray-700 transition-all-300">
                                <i class="fa fa-question-circle"></i>
                                <span>帮助</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <header class="bg-white border-b border-gray-200 shadow-sm z-10">
                <div class="flex items-center justify-between px-6 py-3">
                    <div class="flex items-center">
                        <button id="mobile-menu-button" class="md:hidden text-gray-500 hover:text-gray-700 focus:outline-none">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                        <h2 class="ml-4 md:ml-0 text-lg font-semibold">{% block page_title %}总览{% endblock %}</h2>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                <i class="fa fa-search text-gray-400"></i>
                            </span>
                            <input type="text" placeholder="搜索..." class="pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-sm w-40 md:w-64">
                        </div>
                        
                        <div class="relative">
                            <button class="flex items-center text-gray-500 hover:text-gray-700 focus:outline-none">
                                <i class="fa fa-bell text-xl"></i>
                                <span class="absolute top-0 right-0 h-2 w-2 rounded-full bg-red-500"></span>
                            </button>
                        </div>
                        
                        <div class="flex items-center space-x-2">
                            <img src="https://picsum.photos/id/1005/40/40" alt="用户头像" class="h-8 w-8 rounded-full object-cover">
                            <span class="text-sm font-medium hidden md:block">管理员</span>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 页面内容 -->
            <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        // 移动端菜单切换
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('absolute');
            sidebar.classList.toggle('inset-y-0');
            sidebar.classList.toggle('left-0');
            sidebar.classList.toggle('z-50');
        });
        
        // 点击其他区域关闭移动端菜单
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const mobileButton = document.getElementById('mobile-menu-button');
            
            if (window.innerWidth < 768 && 
                !sidebar.classList.contains('hidden') && 
                !sidebar.contains(event.target) && 
                !mobileButton.contains(event.target)) {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('absolute', 'inset-y-0', 'left-0', 'z-50');
            }
        });
        
        // 窗口大小变化时处理
        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('hidden', 'absolute', 'inset-y-0', 'left-0', 'z-50');
                sidebar.classList.add('block');
            } else {
                sidebar.classList.add('hidden');
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
